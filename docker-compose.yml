# Local development: PostgreSQL always; the API container is optional (profile "full").
#   docker compose up -d db                 -> database only, run the API with 'dotnet run'
#   docker compose --profile full up --build -> database + API at http://localhost:8080/swagger
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: possystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d possystem"]
      interval: 5s
      retries: 10

  api:
    profiles: ["full"]
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=possystem;Username=postgres;Password=postgres"
      Jwt__Key: "local-dev-key-change-me-at-least-32-characters-long"
      Cors__Origins__0: "http://localhost:4200"
      Seed__AdminUsername: admin
      Seed__AdminEmail: admin@example.com
      Seed__AdminPassword: Admin@12345
      Email__Enabled: "false"
    ports: ["8080:10000"]

volumes:
  pgdata:
